<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">Rust Mentor: from ownership error to checked refactor</title>
<desc id="desc">Illustrated Neovim workflow. A moved String causes E0382. Hover explains why and recommends borrowing. A code action applies the compiler-checked replacement, using let moved = &amp;value.</desc>
<rect width="1120" height="900" rx="20" fill="#0b1220"/>
<style>text{font-family:Arial,sans-serif}.code{font-family:Menlo,Consolas,monospace;font-size:18px}.muted{fill:#a8b8ce}.label{font-size:13px;font-weight:700;letter-spacing:2px}</style>
<text x="40" y="47" fill="#7dd3fc" font-size="14" class="label">RUST MENTOR  /  IN YOUR EDITOR</text>
<text x="40" y="94" fill="#e8eef7" font-size="34" class="">Understand the error. Review the fix.</text>
<text x="40" y="127" fill="#a8b8ce" font-size="16" class="">Illustrated workflow · Neovim keybindings from the setup below</text>
<rect x="40" y="155" width="1040" height="201" rx="12" fill="#131f32"/>
<text x="62" y="188" fill="#fda4af" font-size="14" class="label">01  FIND THE ERROR</text>
<text x="887" y="188" fill="#a8b8ce" font-size="15" class="">main.rs · E0382</text>
<text x="62" y="219" fill="#6d829f" font-size="16" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">1</text>
<text x="98" y="219" fill="#dbe8f8" font-size="18" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">fn main() {</text>
<text x="62" y="246" fill="#6d829f" font-size="16" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">2</text>
<text x="142" y="246" fill="#dbe8f8" font-size="18" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">let value = String::from("hello");</text>
<text x="62" y="273" fill="#6d829f" font-size="16" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">3</text>
<text x="142" y="273" fill="#dbe8f8" font-size="18" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">let moved = value;</text>
<rect x="82" y="276" width="969" height="26" rx="4" fill="#3b2335"/>
<text x="62" y="300" fill="#6d829f" font-size="16" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">4</text>
<text x="142" y="300" fill="#fda4af" font-size="18" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">println!("{} {}", value, moved);</text>
<text x="62" y="327" fill="#6d829f" font-size="16" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">5</text>
<text x="98" y="327" fill="#dbe8f8" font-size="18" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">}</text>
<text x="620" y="300" fill="#fda4af" font-size="17" class="">← value was moved</text>
<rect x="40" y="376" width="1040" height="187" rx="12" fill="#142537"/>
<text x="62" y="410" fill="#7dd3fc" font-size="14" class="label">02  UNDERSTAND WHY</text>
<rect x="1001" y="391" width="48" height="31" rx="6" fill="#263b53"/>
<text x="1017" y="413" fill="#e8eef7" font-size="18" class="">K</text>
<text x="62" y="450" fill="#7dd3fc" font-size="19" class="">Why</text>
<text x="124" y="450" fill="#e8eef7" font-size="18" class="">Assigning value to moved transfers ownership, so value cannot be used afterward.</text>
<text x="62" y="486" fill="#6ee7b7" font-size="19" class="">Fix</text>
<text x="124" y="486" fill="#e8eef7" font-size="18" class="">Borrow value with &amp;value so both names can be used without cloning.</text>
<text x="62" y="536" fill="#a8b8ce" font-size="16" class="">Available after analysis completes · explanations remain available if verification fails</text>
<rect x="40" y="583" width="1040" height="243" rx="12" fill="#132b2b"/>
<text x="62" y="618" fill="#6ee7b7" font-size="14" class="label">03  REVIEW &amp; APPLY</text>
<text x="884" y="618" fill="#b7cadd" font-size="18" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">&lt;leader&gt;ca</text>
<rect x="62" y="636" width="996" height="38" rx="6" fill="#20413e"/>
<text x="78" y="661" fill="#a7f3d0" font-size="18" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">›  Apply Verified Rust Mentor Refactor (E0382)</text>
<text x="78" y="708" fill="#fda4af" font-size="18" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">−  let moved = value;</text>
<text x="78" y="741" fill="#6ee7b7" font-size="18" class="code" xml:space="preserve" style="font-family:Menlo,Consolas,monospace;font-size:18px">+  let moved = &amp;value;</text>
<text x="78" y="791" fill="#a8b8ce" font-size="16" class="">Full function replacement · checked again before the versioned edit is offered</text>
<text x="40" y="863" fill="#a8b8ce" font-size="16" class="">Compiler checks establish compilation. Review the change for intended behavior.</text>
</svg>