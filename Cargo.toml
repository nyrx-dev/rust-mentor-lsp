[package]
name = "rust-mentor-lsp"
version = "0.1.0"
edition = "2024"
description = "Companion Language Server for Rust borrow-checker and ownership diagnostics with compiler-verified refactors"
readme = "README.md"
license = "MIT"
repository = "https://github.com/nyrx-dev/rust-mentor-lsp"
keywords = ["lsp", "rust", "borrow-checker", "ownership", "developer-tools"]
categories = ["development-tools"]

[lib]
name = "rust_mentor_lsp"
path = "src/lib.rs"

[dependencies]
dashmap = "6.2.1"
dotenvy = "0.15.7"
jev = { version = "0.1.2", features = ["async"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.9", features = ["full", "visit"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tower-lsp = "0.20.0"
